[theme]
base                     = "dark"
backgroundColor          = "#0e1117"
secondaryBackgroundColor = "#161b22"
primaryColor             = "#1f77b4"
textColor                = "#ffffff"

[server]
# Skip browser-open delay when running headless
headless = true

[browser]
# Disables Streamlit telemetry: eliminates Fivetran webhook calls that fire at
# ~3.2 s and extend the JS dependency chain to 5.6 s, tanking Speed Index
gatherUsageStats = false

[client]
# Remove the top-right toolbar (Deploy / menu buttons) — clears inaccessible
# DOM nodes and shortens the time-to-visual-completion window
toolbarMode = "minimal"
